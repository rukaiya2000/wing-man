# Project-scoped MCP configuration. Complete OAuth when Codex prompts; do not
# put tokens in this file.

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
enabled_tools = ["search", "fetch", "notion-create-pages", "notion-update-page", "notion-get-comments"]

# App-only bearer authentication is supplied through the process environment.
# Its allowlist intentionally contains only read operations.
[mcp_servers.x]
url = "https://api.x.com/mcp"
bearer_token_env_var = "X_BEARER_TOKEN"
enabled_tools = ["search_posts", "get_post", "get_user", "get_user_posts", "get_mentions", "search_users"]

# Configure GitHub OAuth through Codex. No mutation tools are enabled.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
enabled_tools = ["search_code", "get_file_contents", "list_commits", "list_issues", "get_issue", "list_pull_requests", "get_pull_request", "list_pull_request_files"]
